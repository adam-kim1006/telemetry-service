services:
  - type: web
    name: telemetry-sidecar
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: AUTO_RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: telemetry-sidecar-db
          property: connectionString
      - key: TELEMETRY_SHARED_SECRET
        sync: false

databases:
  - name: telemetry-sidecar-db
    plan: free
